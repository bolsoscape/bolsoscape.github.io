<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Bolso Scape</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#0b0f1e;overflow:hidden;touch-action:none;font-family:"Trebuchet MS",system-ui,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:6px;box-shadow:0 0 0 2px #000,0 10px 40px rgba(0,0,0,.6)}
.pad{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:12px;z-index:5;pointer-events:none}
.pad.l{left:max(14px,env(safe-area-inset-left))}
.pad.r{right:max(14px,env(safe-area-inset-right))}
.btn{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(20,24,40,.38);color:#fff;font:700 26px/58px system-ui;text-align:center;touch-action:none}
.btn.on{background:rgba(255,214,0,.55);border-color:#fff}
.btn.big{width:78px;height:78px;line-height:72px;font-size:30px}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:8px;z-index:6}
#top button{width:40px;height:40px;border-radius:10px;border:2px solid rgba(255,255,255,.5);background:rgba(20,24,40,.45);color:#fff;font-size:18px}
#rot{position:fixed;left:0;right:0;top:max(8px,env(safe-area-inset-top));text-align:center;color:#ffe066;font:600 13px system-ui;z-index:4;pointer-events:none}
#cfg{position:fixed;inset:0;z-index:20;background:rgba(5,8,20,.78);display:flex;align-items:center;justify-content:center}
#cfg .box{background:#1b2140;color:#fff;border-radius:14px;padding:18px 20px;width:min(92vw,400px);font:15px system-ui;border:2px solid #ffd400}
#cfg button{padding:9px 12px;border-radius:9px;border:0;background:#ffd400;color:#1c1530;font-weight:700;font-size:14px}
#cfg input{-webkit-user-select:text;user-select:text;flex:1;padding:9px;border-radius:9px;border:0;font-size:16px;min-width:0}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="rot" hidden>📱↻ Gire o celular para jogar com a tela deitada</div>
<div class="pad l" id="padL" hidden>
  <div class="btn" data-k="left">◀</div>
  <div class="btn" data-k="right">▶</div>
</div>
<div class="pad l" id="padV" hidden style="flex-direction:column">
  <div class="btn big" data-k="up">▲</div>
  <div class="btn big" data-k="down">▼</div>
</div>
<div class="pad r" id="padD" hidden style="display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:2px">
  <div></div><div class="btn" data-k="up" style="width:58px;height:58px;line-height:52px">▲</div><div></div>
  <div class="btn" data-k="left" style="width:58px;height:58px;line-height:52px">◀</div><div></div><div class="btn" data-k="right" style="width:58px;height:58px;line-height:52px">▶</div>
  <div></div><div class="btn" data-k="down" style="width:58px;height:58px;line-height:52px">▼</div><div></div>
</div>
<div class="pad r" id="padB" hidden>
  <div class="btn big" data-k="bomb">💣</div>
</div>
<div class="pad r" id="padR" hidden>
  <div class="btn" data-k="down">▼</div>
  <div class="btn big" data-k="jump">⤒</div>
</div>
<div id="top">
  <button id="bCfg" aria-label="Configurações">⚙</button>
  <button id="bMenu" aria-label="Fases">☰</button>
  <button id="bSnd" aria-label="Som">🔊</button>
  <button id="bPause" aria-label="Pausar">⏸</button>
</div>
<div id="cfg" hidden><div class="box">
  <div style="font-size:19px;font-weight:800;color:#ffd400;margin-bottom:8px">⚙ Configurações</div>
  <div id="cfgSt" style="margin-bottom:12px;font-size:13px;color:#cfe0ff"></div>
  <div style="font-size:13px">Token master (libera tudo neste aparelho)</div>
  <div style="display:flex;gap:6px;margin:6px 0 4px"><input id="cfgTok" type="password" autocomplete="off" autocapitalize="characters" placeholder="cole o token aqui"><button id="cfgOk">Ativar</button></div>
  <div id="cfgMsg" style="font-size:13px;min-height:18px"></div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px"><button id="cfgOff">Sair do modo master</button><button id="cfgReset">Apagar progresso</button><button id="cfgClose">Fechar</button></div>
</div></div>
<script>
'use strict';
// ===================== BOLSO SCAPE v2 =====================
const W = 640, H = 352, T = 32, ROWS = 11, GY = 9 * T;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let SCALE = 1;
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
function resize() {
  const vw = innerWidth, vh = innerHeight;
  SCALE = Math.min(vw / W, vh / H);
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.style.width = Math.floor(W * SCALE) + 'px'; cv.style.height = Math.floor(H * SCALE) + 'px';
  cv.width = Math.floor(W * SCALE * dpr); cv.height = Math.floor(H * SCALE * dpr);
  ctx.setTransform(SCALE * dpr, 0, 0, SCALE * dpr, 0, 0);
  document.getElementById('rot').hidden = !(isTouch && vh > vw);
}
addEventListener('resize', resize);

// ---------- rostos dos personagens (desenho vetorial original) ----------
const HW = 220, HH = 240, HOL = '#1c1530';
function hpath(c, pts) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); }
function hfill(c, fill, lw = 5) { c.fillStyle = fill; c.fill(); c.lineWidth = lw; c.strokeStyle = HOL; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); }
function skinGrad(c, x, y, r, a, b) { const g = c.createRadialGradient(x - r * .3, y - r * .4, r * .1, x, y, r * 1.1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
function ear(c, x, y, s, skin, dark) { c.beginPath(); c.ellipse(x, y, 15 * s, 22 * s, 0, 0, 7); hfill(c, skin, 4.5); c.beginPath(); c.ellipse(x, y + 1, 7 * s, 12 * s, 0, 0, 7); c.fillStyle = dark; c.fill(); }

// i) juiz careca: cabeça de ovo lustrosa, sobrancelhas grossas em V, olhar severo, boca para baixo
function hdJuiz(c) {
  const sk = skinGrad(c, 110, 120, 95, '#f6caa5', '#d58f64');
  ear(c, 40, 140, 1, '#e8a982', '#c27a55'); ear(c, 180, 140, 1, '#e8a982', '#c27a55');
  c.beginPath(); c.moveTo(110, 22); c.bezierCurveTo(168, 22, 186, 86, 182, 140); c.bezierCurveTo(178, 192, 150, 222, 110, 224); c.bezierCurveTo(70, 222, 42, 192, 38, 140); c.bezierCurveTo(34, 86, 52, 22, 110, 22); c.closePath(); hfill(c, sk, 6);
  c.save(); c.clip();
  c.fillStyle = 'rgba(80,90,120,.16)'; c.beginPath(); c.ellipse(110, 196, 62, 38, 0, 0, 7); c.fill();
  c.fillStyle = 'rgba(160,80,50,.22)'; c.beginPath(); c.ellipse(60, 170, 18, 26, -.2, 0, 7); c.ellipse(160, 170, 18, 26, .2, 0, 7); c.fill();
  c.restore();
  c.fillStyle = 'rgba(255,255,255,.75)'; c.beginPath(); c.ellipse(82, 52, 22, 11, -.5, 0, 7); c.fill(); c.beginPath(); c.ellipse(112, 40, 7, 4, -.2, 0, 7); c.fill();
  c.strokeStyle = 'rgba(150,80,50,.55)'; c.lineWidth = 3; for (const y of [78, 90]) { c.beginPath(); c.moveTo(80, y); c.quadraticCurveTo(110, y - 6, 140, y); c.stroke(); }
  c.strokeStyle = 'rgba(150,80,50,.6)'; c.lineWidth = 3; c.beginPath(); c.moveTo(103, 110); c.lineTo(106, 124); c.moveTo(117, 110); c.lineTo(114, 124); c.stroke();
  hpath(c, [[52, 104], [102, 118], [100, 130], [54, 116]]); c.closePath(); hfill(c, '#2a1d18', 3);
  hpath(c, [[168, 104], [118, 118], [120, 130], [166, 116]]); c.closePath(); hfill(c, '#2a1d18', 3);
  for (const x of [78, 142]) {
    c.fillStyle = 'rgba(120,60,40,.35)'; c.beginPath(); c.ellipse(x, 152, 20, 9, 0, 0, Math.PI); c.fill();
    c.beginPath(); c.ellipse(x, 140, 14, 7.5, 0, 0, 7); hfill(c, '#fff', 3);
    c.fillStyle = '#2b1a12'; c.beginPath(); c.arc(x + (x < 110 ? 3 : -3), 141, 5, 0, 7); c.fill();
    c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(x - 15, 132, 30, 5);
  }
  c.beginPath(); c.moveTo(110, 136); c.quadraticCurveTo(104, 160, 96, 168); c.quadraticCurveTo(110, 178, 124, 168); c.quadraticCurveTo(116, 160, 112, 136); hfill(c, '#e09a72', 4);
  c.strokeStyle = 'rgba(150,80,50,.6)'; c.lineWidth = 3; c.beginPath(); c.moveTo(88, 166); c.quadraticCurveTo(80, 180, 84, 192); c.moveTo(132, 166); c.quadraticCurveTo(140, 180, 136, 192); c.stroke();
  c.beginPath(); c.moveTo(88, 198); c.quadraticCurveTo(110, 188, 132, 198); c.quadraticCurveTo(110, 194, 88, 198); hfill(c, '#a85a48', 4);
  c.strokeStyle = 'rgba(150,80,50,.5)'; c.lineWidth = 3; c.beginPath(); c.moveTo(100, 212); c.quadraticCurveTo(110, 216, 120, 212); c.stroke();
}

// ii) candidato jovem carioca: cabelo escuro de lado, sobrancelha grossa, sorrisão, bronzeado
function hdCandidato(c) {
  const sk = skinGrad(c, 110, 130, 95, '#f0b98c', '#c88454');
  ear(c, 42, 138, .95, '#e3a578', '#b9744a'); ear(c, 178, 138, .95, '#e3a578', '#b9744a');
  c.beginPath(); c.moveTo(110, 40); c.bezierCurveTo(166, 40, 180, 90, 178, 134); c.bezierCurveTo(176, 186, 152, 222, 110, 224); c.bezierCurveTo(68, 222, 44, 186, 42, 134); c.bezierCurveTo(40, 90, 54, 40, 110, 40); c.closePath(); hfill(c, sk, 6);
  // cabelo
  c.beginPath(); c.moveTo(42, 128); c.bezierCurveTo(30, 60, 70, 18, 116, 20); c.bezierCurveTo(166, 20, 194, 58, 178, 128); c.bezierCurveTo(176, 96, 164, 82, 150, 78); c.bezierCurveTo(124, 86, 96, 84, 72, 66); c.bezierCurveTo(60, 82, 50, 100, 46, 128); c.closePath(); hfill(c, '#2a1a12', 5);
  c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 3; for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(80 + i * 18, 36 + i * 2); c.quadraticCurveTo(110 + i * 14, 50, 140 + i * 8, 70); c.stroke(); }
  c.strokeStyle = '#4a3020'; c.lineWidth = 3; c.beginPath(); c.moveTo(74, 64); c.quadraticCurveTo(84, 44, 96, 30); c.stroke();
  c.fillStyle = '#2a1a12'; c.fillRect(40, 118, 10, 30); c.fillRect(170, 118, 10, 30);
  // sobrancelhas grossas
  c.beginPath(); c.moveTo(56, 116); c.quadraticCurveTo(76, 98, 102, 108); c.lineTo(100, 122); c.quadraticCurveTo(78, 114, 58, 128); c.closePath(); hfill(c, '#24160f', 3);
  c.beginPath(); c.moveTo(164, 116); c.quadraticCurveTo(144, 98, 118, 108); c.lineTo(120, 122); c.quadraticCurveTo(142, 114, 162, 128); c.closePath(); hfill(c, '#24160f', 3);
  // olhos sorridentes
  for (const x of [80, 140]) { c.beginPath(); c.moveTo(x - 14, 144); c.quadraticCurveTo(x, 130, x + 14, 144); c.lineWidth = 5; c.strokeStyle = HOL; c.stroke(); c.strokeStyle = 'rgba(150,80,50,.5)'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(x + (x < 110 ? -16 : 16), 148); c.lineTo(x + (x < 110 ? -22 : 22), 152); c.stroke(); }
  c.fillStyle = 'rgba(230,90,80,.28)'; c.beginPath(); c.ellipse(62, 168, 16, 10, 0, 0, 7); c.ellipse(158, 168, 16, 10, 0, 0, 7); c.fill();
  c.beginPath(); c.moveTo(108, 140); c.quadraticCurveTo(100, 162, 98, 168); c.quadraticCurveTo(110, 176, 122, 168); hfill(c, '#d99464', 4);
  // sorrisão com dentes
  c.beginPath(); c.moveTo(72, 180); c.quadraticCurveTo(110, 228, 148, 180); c.quadraticCurveTo(110, 192, 72, 180); c.closePath(); hfill(c, '#5a1a1a', 5);
  c.save(); c.clip(); c.fillStyle = '#fff'; c.fillRect(70, 180, 80, 14); c.strokeStyle = '#ddd'; c.lineWidth = 1.5; for (let i = 0; i < 7; i++) { c.beginPath(); c.moveTo(80 + i * 10, 182); c.lineTo(80 + i * 10, 194); c.stroke(); } c.fillStyle = '#e06a6a'; c.beginPath(); c.ellipse(110, 210, 20, 9, 0, 0, 7); c.fill(); c.restore();
  c.strokeStyle = 'rgba(150,80,50,.55)'; c.lineWidth = 3; c.beginPath(); c.arc(64, 186, 6, -.8, .8); c.stroke(); c.beginPath(); c.arc(156, 186, 6, Math.PI - .8, Math.PI + .8); c.stroke();
}

// iii) velho barbudo: barba e cabelo brancos, nariz grande, gorro de pele com estrela vermelha
function hdBarbudo(c) {
  const sk = skinGrad(c, 110, 130, 90, '#f7c4ae', '#d98c78');
  ear(c, 44, 132, 1.1, '#efae98', '#c9786a'); ear(c, 176, 132, 1.1, '#efae98', '#c9786a');
  c.beginPath(); c.ellipse(110, 128, 64, 76, 0, 0, 7); hfill(c, sk, 6);
  // cabelo branco nas laterais
  for (const s of [-1, 1]) { c.beginPath(); c.moveTo(110 + s * 50, 92); c.quadraticCurveTo(110 + s * 74, 110, 110 + s * 66, 150); c.quadraticCurveTo(110 + s * 58, 128, 110 + s * 48, 110); c.closePath(); hfill(c, '#eceef2', 4); }
  // barba
  c.beginPath(); c.moveTo(48, 140); c.bezierCurveTo(46, 196, 74, 236, 110, 236); c.bezierCurveTo(146, 236, 174, 196, 172, 140); c.bezierCurveTo(160, 176, 140, 170, 110, 172); c.bezierCurveTo(80, 170, 60, 176, 48, 140); c.closePath(); hfill(c, '#eceef2', 5);
  c.strokeStyle = '#b8bcc6'; c.lineWidth = 2.5; for (let i = 0; i < 11; i++) { const x = 60 + i * 10; c.beginPath(); c.moveTo(x, 180 + (i % 2) * 6); c.quadraticCurveTo(x + 3, 200, x - 2 + (i - 5) * .8, 222 - Math.abs(i - 5) * 3); c.stroke(); }
  // olhos
  for (const x of [84, 136]) { c.fillStyle = 'rgba(150,70,60,.3)'; c.beginPath(); c.ellipse(x, 140, 15, 7, 0, 0, Math.PI); c.fill(); c.beginPath(); c.ellipse(x, 130, 11, 6.5, 0, 0, 7); hfill(c, '#fff', 3); c.fillStyle = '#2b1a12'; c.beginPath(); c.arc(x + 4, 131, 4.5, 0, 7); c.fill(); c.fillStyle = 'rgba(217,140,120,.95)'; c.fillRect(x - 13, 122, 26, 5); }
  // sobrancelhas grisalhas
  for (const s of [-1, 1]) { c.beginPath(); c.moveTo(110 + s * 10, 116); c.quadraticCurveTo(110 + s * 28, 102, 110 + s * 46, 112); c.lineTo(110 + s * 44, 120); c.quadraticCurveTo(110 + s * 28, 112, 110 + s * 12, 122); c.closePath(); hfill(c, '#6a6670', 3); c.strokeStyle = '#d8dae0'; c.lineWidth = 2; c.beginPath(); c.moveTo(110 + s * 18, 114); c.lineTo(110 + s * 26, 108); c.moveTo(110 + s * 32, 110); c.lineTo(110 + s * 40, 106); c.stroke(); }
  // narigão
  c.beginPath(); c.moveTo(106, 128); c.quadraticCurveTo(98, 150, 92, 162); c.bezierCurveTo(92, 178, 128, 178, 128, 162); c.quadraticCurveTo(122, 150, 114, 128); hfill(c, '#e89a88', 4.5);
  c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.ellipse(116, 158, 5, 3, -.4, 0, 7); c.fill();
  // bigode
  c.beginPath(); c.moveTo(110, 172); c.bezierCurveTo(92, 166, 70, 172, 66, 190); c.bezierCurveTo(84, 182, 98, 186, 110, 184); c.bezierCurveTo(122, 186, 136, 182, 154, 190); c.bezierCurveTo(150, 172, 128, 166, 110, 172); hfill(c, '#d6d9e0', 4);
  c.beginPath(); c.ellipse(110, 192, 12, 5, 0, 0, 7); hfill(c, '#8a3a3a', 3);
  // gorro de pele com estrela
  c.beginPath(); c.moveTo(46, 82); c.bezierCurveTo(46, 20, 174, 20, 174, 82); c.closePath(); hfill(c, '#6b5a4c', 5);
  c.beginPath(); rrH(c, 36, 70, 148, 34, 14); hfill(c, '#8a7866', 5);
  c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 2; for (let i = 0; i < 12; i++) { c.beginPath(); c.moveTo(44 + i * 12, 76); c.lineTo(48 + i * 12, 98); c.stroke(); }
  for (const s of [-1, 1]) { c.beginPath(); c.ellipse(110 + s * 70, 104, 14, 22, s * .3, 0, 7); hfill(c, '#8a7866', 4); }
  c.save(); c.translate(110, 86); c.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? 6.5 : 15, a = i * Math.PI / 5 - Math.PI / 2; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); c.fillStyle = '#d8202c'; c.fill(); c.lineWidth = 2.5; c.strokeStyle = '#ffcc33'; c.stroke(); c.restore();
}
function rrH(c, x, y, w, h, r) { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function makeHead(fn) { const cv2 = document.createElement('canvas'); cv2.width = HW; cv2.height = HH; fn(cv2.getContext('2d')); return cv2; }
const IMG = { player: makeHead(hdCandidato), careca: makeHead(hdJuiz), barbudo: makeHead(hdBarbudo) };


// ---------- som ----------
let AC = null, soundOn = true;
try { soundOn = localStorage.getItem('bs_snd') !== '0'; } catch (e) {}
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d, type = 'square', v = .08, slide = 0, delay = 0) {
  if (!soundOn) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
}
const SFX = {
  jump: () => tone(330, .16, 'square', .06, 380),
  coin: () => { tone(988, .07, 'square', .05); tone(1319, .18, 'square', .05, 0, .07); },
  stomp: () => tone(220, .12, 'triangle', .12, -150),
  hurt: () => { tone(300, .1, 'sawtooth', .07, -120); tone(200, .2, 'sawtooth', .07, -100, .1); },
  brk: () => tone(120, .15, 'square', .08, -60),
  bump: () => tone(160, .08, 'square', .06),
  throw: () => tone(700, .12, 'triangle', .06, 500),
  kick: () => tone(500, .08, 'square', .07, -200),
  siren: () => { for (let i = 0; i < 4; i++) { tone(880, .14, 'sawtooth', .05, 0, i * .28); tone(660, .14, 'sawtooth', .05, 0, i * .28 + .14); } },
  flap: () => tone(420, .08, 'triangle', .05, 200),
  horn: () => { tone(300, .2, 'sawtooth', .05); tone(380, .2, 'sawtooth', .05); },
  clear: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .14, 'square', .05, 0, i * .11)),
  win: () => [392, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, .2, 'square', .06, 0, i * .14)),
  over: () => [392, 330, 262, 196].forEach((f, i) => tone(f, .25, 'triangle', .08, 0, i * .22)),
  alert: () => tone(1200, .07, 'square', .04),
};

// ---------- entrada ----------
const K = { left: 0, right: 0, jump: 0, down: 0, up: 0, hold: 0, tapUp: 0, tapDown: 0 };
let jumpPressed = false, anyPressed = false, lastTap = null, bombPressed = false;
const keymap = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', Space: 'jump', KeyZ: 'jump', ArrowDown: 'down', KeyS: 'down' };
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const k = keymap[e.code];
  if (k) { if ((k === 'jump' || k === 'up') && !K[k]) jumpPressed = true; K[k] = 1; e.preventDefault(); }
  if (e.code === 'Enter' || e.code === 'Space') anyPressed = true;
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyX' || e.code === 'KeyB') bombPressed = true;
  ac();
});
addEventListener('keyup', e => { const k = keymap[e.code]; if (k) K[k] = 0; });
const ptrs = new Map();

// ---------- laço principal ----------
function startLevel(idx, fromCP) {
  survIdx = null;
  levelIdx = idx; buildLevel(idx, fromCP); state = 'play'; stT = 0; paused = false;
  if (idx > saved) { saved = idx; try { localStorage.setItem('bs_lvl', idx); } catch (e) {} }
  setPads();
}
function setPads() {
  const play = isTouch && (state === 'play' || state === 'dead') && L;
  document.getElementById('padL').hidden = !(play && L.mode === 'plat');
  document.getElementById('padR').hidden = !(play && (L.mode === 'plat' || L.mode === 'mine'));
  document.getElementById('padD').hidden = !(play && L.mode === 'sewer');
  document.getElementById('padB').hidden = !(play && L.mode === 'shmup');
  document.getElementById('padV').hidden = !(play && L.mode === 'van');
}
function step() {

      if (hitR(SURVBTN)) { if (survOpen()) { state = 'survsel'; stT = 0; } else if (PROG.done) { state = 'paywall'; stT = 0; } else say('🔒 Zere o jogo para liberar o Modo Survival', 90); }
    }
    if (selKey !== null) { if (canPlay(selKey)) { levelIdx = selKey; lives = 5; state = 'card'; stT = 0; } else say('🔒 Termine a fase anterior para liberar', 80); }
  } else if (state === 'paywall') {
    if (stT > 20 && hitR(PAYBTN)) { PROG.surv = true; PROG.done = true; saveProg(); SFX.win(); say('Modo Survival liberado!', 100); state = 'survsel'; stT = 0; }
    else if (stT > 20 && hitR(NOWBTN)) { state = 'select'; stT = 0; }
  } else if (state === 'survsel') {
    if (stT > 15 && lastTap) { for (const c of survCards()) if (hitR(c)) startSurvival(c.i); if (hitR(BACKBTN)) { state = 'select'; stT = 0; } if (MASTER && hitR(VIEWPAY)) { state = 'paywall'; stT = 0; } }
    if (selKey !== null && selKey < 4) startSurvival(selKey);
  } else if (state === 'survend') {
    if (stT > 30 && (hitR(AGAINBTN) || (anyPressed && !lastTap))) startSurvival(survIdx);
    else if (stT > 30 && hitR(MENUBTN)) { state = 'survsel'; stT = 0; L = null; }
  } else if (state === 'card') {
    if ((stT > 40 && anyPressed) || stT > 300) startLevel(levelIdx, false);
  } else if (state === 'play') {
    if (!paused) { if (L.mode === 'plat') updatePlat(); else if (L.mode === 'van') updateVan(); else if (L.mode === 'mine') updateMine(); else if (L.mode === 'sewer') updateSewer(); else if (L.mode === 'shmup') updateShmup(); else updateFlyer(); }
  } else if (state === 'dead') {
    if (stT === 1 && lives <= 0) SFX.over();
    if (stT > 110) {
      if (lives <= 0) { lives = 5; score = Math.floor(score / 2); state = 'card'; stT = 0; L = null; }
      else { const cp = L.cpReached; buildLevel(levelIdx, cp); if (cp) { L.cpOn = true; L.cpReached = true; } state = 'play'; stT = 0; }
    }
  } else if (state === 'clear') {
    if (stT === 121 || stT > 120 && !(PROG.cl && PROG.cl[levelIdx])) { PROG.cl = PROG.cl || {}; PROG.cl[levelIdx] = 1; if (LEVELS.every((_, i) => PROG.cl[i])) PROG.done = true; saveProg(); }
    if (stT > 120) {
      if (levelIdx + 1 >= LEVELS.length) { PROG.un = LEVELS.length - 1; saveProg(); state = 'win'; stT = 0; SFX.win(); saved = 0; try { localStorage.setItem('bs_lvl', 0); } catch (e) {} }
      else { PROG.un = Math.max(PROG.un, levelIdx + 1); saveProg(); levelIdx++; state = 'card'; stT = 0; if (levelIdx > saved) { saved = levelIdx; try { localStorage.setItem('bs_lvl', levelIdx); } catch (e) {} } }
    }
  } else if (state === 'win') {
    if (stT > 90 && anyPressed) { if (!PROG.done) { const f = LEVELS.map((_, i) => i).filter(i => !(PROG.cl && PROG.cl[i])).map(i => i + 1); state = 'select'; say('Para liberar o Survival, conclua também a(s) fase(s) ' + f.join(', '), 160); } else state = PROG.surv ? 'select' : 'paywall'; stT = 0; }
  }
  if (L && L.parts) { for (const q of L.parts) { q.x += q.vx; q.y += q.vy; q.vy += q.g || 0; q.t--; } L.parts = L.parts.filter(q => q.t > 0); for (const q of L.pops) { q.y += q.vy; q.vy += q.txt ? 0 : .35; q.t--; } L.pops = L.pops.filter(q => q.t > 0); }

  if (shake > 0) shake--;

}
function render() {

  else if (state === 'paywall') drawPaywall();
  else if (state === 'survsel') drawSurvSel();
  else if (state === 'win') drawWin();

    const camOff = (L.mode === 'plat' || L.mode === 'mine') ? camX : 0;

      if (L.idx === 0 && P.x < 400) txt(isTouch ? '▶ andar  ⤒ pular — pise nos carecas!' : '→ andar  ↑/espaço pular — pise nos carecas!', W / 2, 70, 14, '#fff');
    } else if (L.mode === 'van') drawVanLevel();

    else if (L.mode === 'shmup') drawShmup();

    if (L.mode !== 'sewer') for (const q of L.parts) { ctx.fillStyle = q.c; if (q.round) { ctx.beginPath(); ctx.arc(q.x - camOff, q.y, q.s * (q.t / 20), 0, 7); ctx.fill(); } else ctx.fillRect(q.x - camOff, q.y, q.s, q.s); }
    for (const q of L.pops) { if (q.txt) txt(q.txt, q.x - camOff + 12, q.y, 12, '#fff'); else coinDraw(q.x - camOff + 8, q.y, 8); }
    // vinheta
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, W * .65); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,0,30,.28)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    drawHUD();
    if (state === 'dead') drawDead();

let last = performance.now(), accT = 0;
function loop(now) {
  const dt = Math.min(100, now - last); last = now; accT += dt * (window.__ts || 1);

  while (accT >= 1000 / 60 && n < 8) { step(); accT -= 1000 / 60; n++; }
  if (n >= 8) accT = 0;
  render();

}
resize();
requestAnimationFrame(loop);
window.__bs = { get state() { return state; }, get L() { return L; }, get P() { return P; }, K, startLevel, get lives() { return lives; }, set lives(v) { lives = v; }, get hearts() { return hearts; }, press() { jumpPressed = true; anyPressed = true; } };
